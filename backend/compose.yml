name: emploi-go-local
services:
  postgres:
    # PostgreSQL 18.6 with PostGIS: postgis/postgis publishes no arm64 image.
    image: emploi-go/postgres
    build: ./postgres
    pull_policy: build
    environment:
      POSTGRES_DB: emploigo
      POSTGRES_USER: emploigo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emploigo -d emploigo']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.10.2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-development-only}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  redis-data:

spring:
  application:
    name: emploi-go
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management:
  server:
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
emploi-go:
  google:
    enabled: ${GOOGLE_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
  registration:
    mail-mode: ${REGISTRATION_MAIL_MODE:disabled}
    sender: ${REGISTRATION_MAIL_FROM:confirmation@example.invalid}
    public-origin: ${PUBLIC_APP_ORIGIN:http://localhost:5173}
    resend-key: ${RESEND_API_KEY:}
    local-mail-url: ${LOCAL_MAIL_URL:http://127.0.0.1:8025/emails}
    token-key: ${CONFIRMATION_TOKEN_KEY:}
---
spring:
  config:
    activate:
      on-profile: '!worker'
    import: classpath:application-api.yml

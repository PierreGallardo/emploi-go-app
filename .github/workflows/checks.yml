name: Vérifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend et outils
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer npm
        run: npm install --global npm@11.17.0
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les scripts, le formatage et le frontend
        run: npm run check -- scripts format frontend

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Installer npm
        run: npm install --global npm@11.17.0
      - name: Installer Java et préparer le cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS' # Temurin 25.0.4.1+1
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Vérifier Docker
        run: docker info
      - name: Compiler et tester le backend
        id: backend-tests
        run: npm run check -- backend
      - name: Conserver les rapports des tests backend en échec
        if: ${{ failure() && steps.backend-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/surefire-reports/*.txt
            backend/target/failsafe-reports/*.xml
            backend/target/failsafe-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7

  api-contract:
    name: Contrat API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer npm
        run: npm install --global npm@11.17.0
      - name: Installer Java et préparer le cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS' # Temurin 25.0.4.1+1
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier Docker
        run: docker info
      - name: Vérifier le contrat et les types frontend
        run: npm run check -- contract

  e2e:
    name: Raccordement frontend et backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer npm
        run: npm install --global npm@11.17.0
      - name: Installer Java et préparer le cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS' # Temurin 25.0.4.1+1
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium, WebKit et leurs dépendances système
        run: npm run browsers:install --workspace frontend
      - name: Vérifier Docker
        run: docker info
      - name: Tester le raccordement dans le navigateur
        id: browser-tests
        run: npm run test:e2e
      - name: Conserver le rapport et les traces navigateur en cas d'échec
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: .
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Construire l'image sans la publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
